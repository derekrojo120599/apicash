[package]
name = "apicash_core"
version = "0.1.0"
edition = "2021"
description = "Core financial calculations and currency conversion for Apicash"

[dependencies]
rust_decimal = { version = "1.36", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
